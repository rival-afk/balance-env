[package]
name = "balance-env"
version = "0.1.0"
edition = "2021"
description = "Headless Balance environment for neural network training (PyO3). Port of the Godot game's physics."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
rand = "0.8"
